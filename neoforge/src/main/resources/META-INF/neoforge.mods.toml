modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mixins]]
    config = "pvpoption.common.mixins.json"

[[mods]]
    modId = "pvpoption"
    version = "${version}"
    displayName = "pvpOption"
    description = "Opt-in PvP flagging system. Only players flagged for PvP can deal and take damage from each other."
    displayURL = "https://github.com/LunixiaLIVE/Lunixia-Minecraft-QOL-Mods"

[[dependencies.pvpoption]]
    modId = "neoforge"
    type = "required"
    versionRange = "[26.1,26.2)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.pvpoption]]
    modId = "minecraft"
    type = "required"
    versionRange = "[26.1,26.2)"
    ordering = "NONE"
    side = "BOTH"
